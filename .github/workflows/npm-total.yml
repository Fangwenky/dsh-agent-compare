name: Cumulative npm downloads

on:
  schedule:
    # 19:00 Asia/Shanghai (UTC+8), once daily.
    - cron: '0 11 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cumulative-npm-downloads
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
      - run: node --test test/npm-total-downloads.node.mjs
      - run: node scripts/npm-total-downloads.mjs
      - run: node scripts/npm-total-downloads.mjs --check
      - run: node scripts/metric-badges.mjs
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: node scripts/metric-badges.mjs --check
      - name: Save changed public metrics
        env:
          GIT_AUTHOR_NAME: lijiaqimun-coder
          GIT_AUTHOR_EMAIL: lijiaqi.mun@gmail.com
          GIT_COMMITTER_NAME: lijiaqimun-coder
          GIT_COMMITTER_EMAIL: lijiaqi.mun@gmail.com
        shell: bash
        run: |
          git add -- assets/statistics/npm-total-*.svg docs/measurements/npm-total.json
          git add -- assets/statistics/github-stars.svg docs/measurements/github-stars.json
          git add -- assets/statistics/dsh-market-download-rank.svg assets/statistics/dshso-weekly-download-rank.svg assets/statistics/dshso-weekly-stars.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh public README metrics"
          git push origin HEAD:main

